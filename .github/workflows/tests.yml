name: Test RescueRoute AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js
      - run: node --check frontend/arena/app.js
      - run: node --check frontend/live/app.js
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Verify the committed TypeScript build is up to date
        run: |
          npx tsc
          git diff --exit-code -- frontend/medic/app.js
